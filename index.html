<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHANMUGAM - Portfolio</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f4f4f9; color: #333; text-align: center; }
        .card { max-width: 950px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { color: #111; margin-bottom: 5px; }
        p { color: #666; font-size: 1.1rem; }
        .btn { display: inline-block; padding: 12px 24px; margin: 15px 5px; background: #007bff; color: white; text-decoration: none; border-radius: 6px; font-weight: bold; }
        .btn:hover { background: #0056b3; }
        .pdf-viewer-container { margin-top: 25px; width: 100%; max-height: 800px; overflow-y: auto; border: 1px solid #ddd; border-radius: 8px; background: #525659; padding: 10px 0; }
        canvas { display: block; margin: 10px auto; max-width: 95%; box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
    </style>
</head>
<body>

    <div class="card">
        <h1>SHANMUGAM</h1>
        <p>Graphic Designer & Visual Layout Specialist</p>
        
        <!-- Contact & PDF Download Buttons -->
        <a href="mailto:yourname@email.com" class="btn">Contact Me</a>
        <a href="portfolio.pdf" target="_blank" class="btn">Download / View PDF</a>

        <!-- Universal PDF Render Container -->
        <div class="pdf-viewer-container" id="pdf-container">
            <p style="color:white;" id="loading-text">Loading PDF Portfolio...</p>
        </div>
    </div>

    <script>
        const url = 'portfolio.pdf';
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';

        pdfjsLib.getDocument(url).promise.then(pdf => {
            document.getElementById('loading-text').style.display = 'none';
            const container = document.getElementById('pdf-container');

            for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
                pdf.getPage(pageNum).then(page => {
                    const scale = 1.5;
                    const viewport = page.getViewport({ scale: scale });

                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');
                    canvas.height = viewport.height;
                    canvas.width = viewport.width;

                    container.appendChild(canvas);

                    const renderContext = {
                        canvasContext: context,
                        viewport: viewport
                    };
                    page.render(renderContext);
                });
            }
        }).catch(err => {
            document.getElementById('loading-text').innerText = 'PDF Load Aagala. Mela irukura Download button-a click pannunga.';
        });
    </script>

</body>
</html>
